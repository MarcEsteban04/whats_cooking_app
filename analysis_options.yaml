# Lint configuration for What's Cooking?
#
# The rules below encode docs/CODING_STANDARDS.md so the analyzer, rather than a
# reviewer, enforces the conventions. `flutter analyze` must be clean before every
# commit (docs/GIT_WORKFLOW.md).

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # Generated code is git-ignored and not hand-maintained.
    - "**/*.g.dart"
    - "**/*.freezed.dart"

  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # Standards violations that must fail the build, not merely warn.
    always_declare_return_types: error
    prefer_single_quotes: error
    directives_ordering: error
    avoid_print: error
    # TODOs are tracked in the roadmap, not surfaced as analyzer noise.
    todo: ignore

linter:
  rules:
    # §1 Language & formatting
    - always_declare_return_types
    - prefer_single_quotes
    - require_trailing_commas
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - prefer_final_locals
    - unnecessary_parenthesis
    - unnecessary_lambdas

    # §3 Imports — package imports only, correctly ordered
    - always_use_package_imports
    - directives_ordering
    - depend_on_referenced_packages

    # §8 UI
    - use_super_parameters
    - sized_box_for_whitespace
    - use_colored_box
    - use_decorated_box
    - avoid_unnecessary_containers

    # §10 Security — no print, ever; use core/utils/logger.dart
    - avoid_print

    # General correctness
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - comment_references
    - literal_only_boolean_expressions
    - no_adjacent_strings_in_list
    - throw_in_finally
    - unawaited_futures
    - use_build_context_synchronously
    - avoid_void_async
    - prefer_void_to_null

    # Documentation on the shared layers people read most
    - slash_for_doc_comments
