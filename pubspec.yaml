name: whats_cooking
description: "Decide what to eat in under a minute. A Flutter + Supabase meal-decision app for couples and households."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  cached_network_image: ^3.4.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  flutter_secure_storage: ^11.0.0
  freezed_annotation: ^3.1.0
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  intl: ^0.20.3
  json_annotation: ^4.12.0
  riverpod_annotation: ^4.0.6
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.0
  riverpod_generator: ^4.0.8
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.14.1
  mocktail: ^1.0.5

  # Generates the launcher icons from assets/brand (Sprint 34).
  flutter_launcher_icons: ^0.14.4

  # Paints the brand mark on the native launch window (Sprint 34). Not a
  # "branded delay": this window exists while the engine boots whether or not
  # anything is drawn on it.
  flutter_native_splash: ^2.4.6

  # Used by tool/build_brand_assets.dart to pad the logo into an adaptive-icon
  # foreground. A dev dependency because nothing at runtime decodes a PNG by hand.
  image: ^4.3.0

flutter:
  uses-material-design: true

  assets:
    # The brand mark, and the only asset the app bundles. Full colour and green,
    # unlike every other pixel here — see docs/DESIGN_SYSTEM.md §2.2. A logo is a
    # logo; the interface around it stays ink.
    #
    # The directory is *not* declared wholesale on purpose: assets/brand/source/
    # holds the megabyte master and the launcher-icon sources, which are build
    # inputs and have no business in an APK.
    - assets/brand/logo.png

# ---------------------------------------------------------------------------
# Launcher icons (Sprint 34)
#
# Sources are derived from the one brand asset by tool/build_brand_assets.dart;
# see that file for why a launcher icon needs two of them rather than one.
# Regenerate with:
#   dart run tool/build_brand_assets.dart && dart run flutter_launcher_icons
# ---------------------------------------------------------------------------
flutter_launcher_icons:
  # The flattened square, for iOS and for Android's legacy icon. Both show the
  # launcher's own background through any transparency, and iOS rejects alpha in
  # an app icon outright.
  image_path: "assets/brand/source/launcher_opaque.png"

  android: true
  ios: true
  remove_alpha_ios: true

  # Adaptive icons get the inset foreground instead, because Android masks the
  # outer third of that layer to whatever shape the launcher prefers — the cloche
  # lid and the fork are exactly what disappears when art fills its canvas.
  adaptive_icon_foreground: "assets/brand/source/launcher_foreground.png"

  # White, matching the flattened version. The mark was drawn for a light ground:
  # its cutlery is white with grey shading, so it reads on white and vanishes on
  # anything paler than itself.
  adaptive_icon_background: "#FFFFFF"

  web:
    generate: true
    image_path: "assets/brand/source/launcher_opaque.png"
    background_color: "#FFFFFF"
    theme_color: "#E8622A"

  windows:
    generate: true
    image_path: "assets/brand/source/launcher_opaque.png"
    icon_size: 256

  macos:
    generate: true
    image_path: "assets/brand/source/launcher_opaque.png"

# ---------------------------------------------------------------------------
# Native launch screen (Sprint 34)
#
# The window the platform paints before Flutter has started. docs/ARCHITECTURE
# forbids a *branded delay* — a logo screen held open to look impressive — and
# this is the opposite: the window is already there for as long as the engine
# takes to boot, and the choice is only whether it is blank.
#
# It is also the one place a signed-in user reliably meets the mark. The welcome
# and onboarding screens carry it too, and a returning household never sees
# either of them again.
#
# Regenerate with: dart run flutter_native_splash:create
# ---------------------------------------------------------------------------
flutter_native_splash:
  # The app background and its dark counterpart, so the launch window is the
  # same ground the first frame paints on and there is no flash between them.
  color: "#F7F7F5"
  color_dark: "#141412"

  # The transparent mark, not the flattened one: it sits on the colours above.
  image: assets/brand/logo.png
  image_dark: assets/brand/logo.png

  android: true
  ios: true
  web: false

  android_12:
    # Android 12+ masks this to a circle and ignores anything outside the inner
    # two thirds, so it gets the already-inset foreground rather than the full
    # mark — the same reason the adaptive launcher icon does.
    image: assets/brand/source/launcher_foreground.png
    image_dark: assets/brand/source/launcher_foreground.png
    color: "#F7F7F5"
    color_dark: "#141412"
